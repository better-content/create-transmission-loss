side="BOTH"

[[dependencies.${modId}]]
modId="minecraft"
mandatory=true
versionRange="[${minecraftVersion},1.21)"
ordering="NONE"
side="BOTH"

[[dependencies.${modId}]]
modId="kotlinforforge"
mandatory=true
versionRange="[${kffVersion},)"
ordering="NONE"
side="BOTH"

[[dependencies.${modId}]]
modId="create"
mandatory=true
versionRange="${createVersionRange}"
ordering="AFTER"
side="BOTH"
